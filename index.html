<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Rebates Estable</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4ff;color:#172033}.wrap{max-width:1440px;margin:auto;padding:14px}.card{background:white;border:1px solid #d9e2f2;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(37,99,235,.06)}h1{font-size:24px;margin:0 0 4px}.note{font-size:12px;color:#667085}.ok{color:#166534;font-weight:800}.bad{color:#991b1b;font-weight:800}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}label{font-size:11px;font-weight:800;color:#667085;text-transform:uppercase;display:block;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #d9e2f2;border-radius:10px;background:white;min-height:42px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{cursor:pointer}.kpi b{font-size:28px;display:block;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.tablewrap{overflow:auto;max-height:58vh;border:1px solid #d9e2f2;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px;font-size:12px}th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}th{position:sticky;top:0;background:#1e40af;color:white;text-align:left}.num{text-align:right}.btn{border:0;background:#1d4ed8;color:white;padding:10px 12px;border-radius:10px;font-weight:800;cursor:pointer}.btn2{border:1px solid #d9e2f2;background:white;padding:10px 12px;border-radius:10px;font-weight:800;cursor:pointer}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.red{background:#fee2e2;color:#991b1b}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}.blue{background:#dbeafe;color:#1e40af}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:20px}table{min-width:760px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>Dashboard Rebates - Estable</h1><div class="note">Carga automática desde <b>reembolsos.csv</b>. Versión limpia para validar datos.</div></div>
  <div class="card"><b>Estado</b><div id="status" class="note">Cargando...</div><div id="diag" class="note" style="margin-top:6px"></div></div>

  <div class="card filters">
    <div><label>Sede</label><select id="fSede"></select></div>
    <div><label>Supervisor / grupo</label><select id="fGrupo"></select></div>
    <div><label>Vendedor</label><select id="fVend"></select></div>
    <div><label>Día</label><select id="fDia"></select></div>
    <div><label>Buscar cliente</label><input id="fSearch" placeholder="Código o nombre"></div>
  </div>

  <div class="card filters">
    <div><label>Cerca desde %</label><input id="nearMin" type="number" value="80"></div>
    <div><label>Cerca hasta %</label><input id="nearMax" type="number" value="99"></div>
    <div><label>Cuota mínima</label><input id="quotaMin" type="number" placeholder="Todas"></div>
    <div><label>Cuota máxima</label><input id="quotaMax" type="number" placeholder="Todas"></div>
    <div><label>&nbsp;</label><button class="btn2" onclick="resetFilters()">Limpiar filtros</button></div>
  </div>

  <div class="kpis">
    <div class="card kpi" onclick="showDetail('ganado_no_usado')">Ganó y no usó V<b id="k1">0</b></div>
    <div class="card kpi" onclick="showDetail('ganado_usado')">Ganó y usó V<b id="k2">0</b></div>
    <div class="card kpi" onclick="showDetail('cerca')">Cerca<b id="k3">0</b></div>
    <div class="card kpi" onclick="showDetail('lejos')">Lejos<b id="k4">0</b></div>
    <div class="card kpi" onclick="showDetail('total')">Clientes únicos<b id="k5">0</b></div>
  </div>

  <div class="grid">
    <div class="card"><h3>Ranking supervisor</h3><div id="grupoTable" class="tablewrap"></div></div>
    <div class="card"><h3>Ranking vendedor</h3><div id="vendTable" class="tablewrap"></div></div>
    <div class="card full"><h3 id="detailTitle">Clientes</h3><button class="btn" onclick="exportDetail()">Exportar Excel</button><div id="detailInfo" class="note" style="margin:8px 0"></div><div id="detailTable" class="tablewrap"></div></div>
  </div>
</div>
<script>
let DATA=[],CLIENTS=[],ROWS=[],DETAIL=[],TYPE='ganado_no_usado',SUP='Todos',VEN='Todos';
const C={
sede:['SUCURSAL','Sucursal','Sede','SEDE'],
grupo:['grupoventas','Grupo Ventas','Grupo','Supervisor','Mesa','MESA'],
vendedor:['Vendedor','Cod Vendedor','Codigo Vendedor','FuerzaVentas','FV'],
cliente:['Cliente','Cod Cliente','Codigo Cliente','ClienteCodigo','COD CLIENTE'],
nombre:['Nombre Cliente','Cliente Nombre','Nombre','Razon Social'],
dia:['DiaDeSemana','Dia de Semana','Día de Semana','Dia','DIA'],
cuota:['CUOTA REBATE','Cuota Rebate','Cuota','Plan'],
avance:['AV REBATE','Avance Rebate','Avance','Venta'],
gap:['FALTA REBATE','Falta Rebate','Gap','Falta'],
pct:['%AVANCE','% Avance','Porcentaje avance','Avance %'],
uso:['¿Usó la V?','Uso la V?','Usó la V?','Uso V','USO V','Uso'],
pvta:['PVTA','Preventa','PREVENTA','Preventa Hoy']
};
function nk(s){return String(s||'').replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?]/g,'').replace(/[_\-.\/]+/g,' ').replace(/\s+/g,' ')}
function pick(r,a){let keys=Object.keys(r||{}),m={};keys.forEach(k=>m[nk(k)]=r[k]);for(let x of a){let v=m[nk(x)];if(v!==undefined&&String(v).trim()!=='')return v}for(let k of keys){for(let x of a){if(nk(k).includes(nk(x))||nk(x).includes(nk(k))){let v=r[k];if(v!==undefined&&String(v).trim()!=='')return v}}}return''}
function num(x){if(x==null||x==='')return 0;if(typeof x==='number')return x;let s=String(x).replace(/S\/|\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');s=s.replace(/[^0-9.\-]/g,'');let n=parseFloat(s);return isNaN(n)?0:n}
function uso(x){let s=String(x||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();return ['SI','S','1','TRUE','X','USO','USADO','CANJEADO'].includes(s)||s.includes('SI')||s.includes('USO')||s.includes('CANJE')}
function row(r){let cuota=num(pick(r,C.cuota)),avance=num(pick(r,C.avance)),gapRaw=pick(r,C.gap);let gap=String(gapRaw).trim()===''?Math.max(0,cuota-avance):num(gapRaw);let pct=num(pick(r,C.pct));if(pct>3)pct=pct/100;if(!pct&&cuota)pct=avance/cuota;return{sede:String(pick(r,C.sede)).trim(),grupo:String(pick(r,C.grupo)).trim(),vendedor:String(pick(r,C.vendedor)).trim(),cliente:String(pick(r,C.cliente)).trim(),nombre:String(pick(r,C.nombre)).trim(),dia:String(pick(r,C.dia)).trim(),cuota,avance,gap,pct,pvta:num(pick(r,C.pvta)),uso_v:uso(pick(r,C.uso))?'SI':'NO'}}
function money(n){return 'S/ '+(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(n){return(n||0).toLocaleString('es-PE')}
function near(){let a=parseFloat(nearMin.value||80)/100,b=parseFloat(nearMax.value||99)/100;if(a>b){let t=a;a=b;b=t}return{a,b}}
function won(x){return x.cuota>0&&(x.pct>=1||x.avance>=x.cuota)}
function cls(x){let n=near(),w=won(x),u=x.uso_v===true||x.uso_v==='SI';if(w&&!u)return'ganado_no_usado';if(w&&u)return'ganado_usado';if(!w&&x.pct>=n.a&&x.pct<=n.b)return'cerca';return'lejos'}
function fill(id,arr){let el=document.getElementById(id),cur=el.value||'Todos';let vals=['Todos',...Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'))];el.innerHTML=vals.map(x=>`<option value="${x}">${x}</option>`).join('');el.value=vals.includes(cur)?cur:'Todos'}
function refresh(){let s=fSede.value||'Todos',g=fGrupo.value||'Todos',v=fVend.value||'Todos';fill('fSede',DATA.map(x=>x.sede));let bg=DATA.filter(x=>s==='Todos'||x.sede===s);fill('fGrupo',bg.map(x=>x.grupo));let bv=bg.filter(x=>g==='Todos'||x.grupo===g);fill('fVend',bv.map(x=>x.vendedor));let bd=bv.filter(x=>v==='Todos'||x.vendedor===v);fill('fDia',bd.map(x=>x.dia))}
function filtered(){let s=fSede.value,g=fGrupo.value,v=fVend.value,d=fDia.value,q=fSearch.value.toLowerCase(),mn=parseFloat(quotaMin.value)||0,mx=parseFloat(quotaMax.value)||Infinity;return DATA.filter(x=>(s==='Todos'||x.sede===s)&&(g==='Todos'||x.grupo===g)&&(v==='Todos'||x.vendedor===v)&&(d==='Todos'||x.dia===d)&&x.cuota>=mn&&x.cuota<=mx&&(!q||x.cliente.toLowerCase().includes(q)||x.nombre.toLowerCase().includes(q)))}
function clients(rows){let m=new Map();rows.forEach(r=>{let k=r.cliente||r.nombre;if(!m.has(k))m.set(k,{...r,grupo:new Set(),vendedor:new Set(),dia:new Set(),uso_v:false});let x=m.get(k);x.grupo.add(r.grupo);x.vendedor.add(r.vendedor);x.dia.add(r.dia);x.cuota=Math.max(x.cuota,r.cuota);x.avance=Math.max(x.avance,r.avance);x.pct=Math.max(x.pct,r.pct);x.gap=Math.max(0,x.cuota-x.avance);x.pvta+=r.pvta;x.uso_v=x.uso_v||r.uso_v==='SI'});return Array.from(m.values()).map(x=>({...x,grupo:[...x.grupo].join(', '),vendedor:[...x.vendedor].join(', '),dia:[...x.dia].join(', '),uso_v:x.uso_v?'SI':'NO'}))}
function agg(arr,key){let m={};arr.forEach(x=>{String(x[key]||'Sin dato').split(',').map(z=>z.trim()).filter(Boolean).forEach(k=>{if(!m[k])m[k]={name:k,total:0,opp:0,cerca:0,lejos:0};let c=cls(x);m[k].total++;if(c==='ganado_no_usado')m[k].opp++;if(c==='cerca')m[k].cerca++;if(c==='lejos')m[k].lejos++})});return Object.values(m).sort((a,b)=>b.opp-a.opp)}
function drawAgg(id,a,label){document.getElementById(id).innerHTML='<table><thead><tr><th>'+label+'</th><th>Total</th><th>Ganó no usó</th><th>Cerca</th><th>Lejos</th></tr></thead><tbody>'+a.slice(0,80).map(x=>`<tr><td>${x.name}</td><td class=num>${fmt(x.total)}</td><td class=num>${fmt(x.opp)}</td><td class=num>${fmt(x.cerca)}</td><td class=num>${fmt(x.lejos)}</td></tr>`).join('')+'</tbody></table>'}
function render(){ROWS=filtered();CLIENTS=clients(ROWS);let k={ganado_no_usado:0,ganado_usado:0,cerca:0,lejos:0};CLIENTS.forEach(x=>k[cls(x)]++);k1.textContent=fmt(k.ganado_no_usado);k2.textContent=fmt(k.ganado_usado);k3.textContent=fmt(k.cerca);k4.textContent=fmt(k.lejos);k5.textContent=fmt(CLIENTS.length);drawAgg('grupoTable',agg(CLIENTS,'grupo'),'Supervisor/grupo');drawAgg('vendTable',agg(ROWS,'vendedor'),'Vendedor/visita');showDetail(TYPE)}
function showDetail(t){TYPE=t;DETAIL=(t==='total'?CLIENTS:CLIENTS.filter(x=>cls(x)===t));detailTitle.textContent='Clientes - '+t.replaceAll('_',' ');detailInfo.textContent='Mostrando '+fmt(DETAIL.length)+' clientes';detailTable.innerHTML='<table><thead><tr><th>Cliente</th><th>Nombre</th><th>Vendedor</th><th>Día</th><th>Cuota</th><th>Avance</th><th>Gap</th><th>%</th><th>PVTA</th><th>Estado</th></tr></thead><tbody>'+DETAIL.slice(0,300).map(x=>`<tr><td>${x.cliente}</td><td>${x.nombre}</td><td>${x.vendedor}</td><td>${x.dia}</td><td class=num>${money(x.cuota)}</td><td class=num>${money(x.avance)}</td><td class=num>${money(x.gap)}</td><td class=num>${(x.pct*100).toFixed(2)}%</td><td class=num>${money(x.pvta)}</td><td>${cls(x)}</td></tr>`).join('')+'</tbody></table>'}
function resetFilters(){['fSede','fGrupo','fVend','fDia'].forEach(id=>document.getElementById(id).value='Todos');fSearch.value='';quotaMin.value='';quotaMax.value='';refresh();render()}
function exportDetail(){let ws=XLSX.utils.json_to_sheet(DETAIL),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Detalle');XLSX.writeFile(wb,'detalle.xlsx')}
async function load(){try{let r=await fetch('reembolsos.csv?v='+Date.now(),{cache:'no-store'});let txt=await r.text();let p=Papa.parse(txt,{header:true,skipEmptyLines:true,delimitersToGuess:[',',';','\t','|']});if(p.meta.fields.length<=1)p=Papa.parse(txt,{header:true,skipEmptyLines:true,delimiter:';'});DATA=p.data.map(row).filter(x=>x.cliente||x.nombre);status.textContent='Datos cargados: '+fmt(DATA.length)+' filas';status.className='note ok';diag.textContent='Columnas detectadas: '+p.meta.fields.slice(0,12).join(' | ');refresh();render()}catch(e){status.textContent='Error: '+e.message;status.className='note bad'}}
['fSede','fGrupo','fVend','fDia'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{refresh();render()}));['fSearch','nearMin','nearMax','quotaMin','quotaMax'].forEach(id=>document.getElementById(id).addEventListener('input',render));load();
</script>
</body>
</html>
